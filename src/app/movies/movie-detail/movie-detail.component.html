<form class="detail-card">
  <div class="detail-topline">
    <span class="detail-kicker">NOW SHOWING</span>
    <span class="detail-id">NO. {{ movie()?.id }}</span>
  </div>
  <span class="detail-art" aria-hidden="true">✳</span>
  <h2>Movie details</h2>
  <div class="detail-fields">
    <label class="detail-field" for="name">
      <span class="field-label">Name</span>
      <input id="name" name="name" type="text" [(ngModel)]="movie().name" />
    </label>

    <label class="detail-field" for="genre">
      <span class="field-label">Genre</span>
      <input id="genre" name="genre" type="text" [(ngModel)]="movie().genre" />
    </label>

    <label class="detail-field" for="rating">
      <span class="field-label">Rating <span class="field-hint">/ 10</span></span>
      <input id="rating" name="rating" type="number" [(ngModel)]="movie().rating" />
    </label>
    <button type="button" class="save-button" (click)="OnSaveClicked()">
      <span>Save</span>
      <span class="save-button-sparkle" aria-hidden="true">✦</span>
    </button>
  </div>
</form>
